seed: 42
output_dir: outputs/ranker/deberta_v3_large_kbs_official_student_v1

model:
  pretrained_name: models/deberta-v3-large
  dropout: 0.1

data:
  train_samples: data/kbs_teacher_student_v1_hybrid_frontend/samples/train.jsonl
  val_samples: data/kbs_teacher_student_v1_hybrid_frontend/samples/val.jsonl
  test_samples: data/kbs_teacher_student_v1_hybrid_frontend/samples/test.jsonl

  train_memory: data/kbs_teacher_student_v1_hybrid_frontend/unit_registry/raw_units_train.jsonl
  val_memory: data/kbs_teacher_student_v1_hybrid_frontend/unit_registry/raw_units_val.jsonl
  test_memory: data/kbs_teacher_student_v1_hybrid_frontend/unit_registry/raw_units_test.jsonl

  train_role_targets: data/kbs_teacher_student_v1_hybrid_frontend/targets/train.jsonl
  val_role_targets: data/kbs_teacher_student_v1_hybrid_frontend/targets/val.jsonl
  test_role_targets: data/kbs_teacher_student_v1_hybrid_frontend/targets/test.jsonl

train:
  init_checkpoint: outputs/ranker/deberta_v3_large_v17_candidate_contribution_lr5e7/best_model.pt
  batch_size: 1
  num_workers: 0
  epochs: 3
  lr: 5.0e-7
  weight_decay: 0.01
  warmup_ratio: 0.10
  max_length: 320
  grad_accum_steps: 16
  max_grad_norm: 1.0
  log_every: 20
  fp16: false
  role_aux_weight: 0.10
  candidate_role_aux_weight: 0.20
  deficit_aux_weight: 0.20
  contribution_aux_weight: 0.20
