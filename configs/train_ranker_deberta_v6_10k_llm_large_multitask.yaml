seed: 42
output_dir: outputs/ranker/deberta_v3_large_v6_10k_llm_multitask

model:
  pretrained_name: models/deberta-v3-large
  dropout: 0.1

data:
  train_samples: data/hotpotqa_distractor_v6_10k_llm/samples/train.jsonl
  val_samples: data/hotpotqa_distractor_v6_10k_llm/samples/val.jsonl
  test_samples: data/hotpotqa_distractor_v6_10k_llm/samples/test.jsonl

  train_memory: data/hotpotqa_distractor_v6_10k_llm/unit_registry/raw_units_train.jsonl
  val_memory: data/hotpotqa_distractor_v6_10k_llm/unit_registry/raw_units_val.jsonl
  test_memory: data/hotpotqa_distractor_v6_10k_llm/unit_registry/raw_units_test.jsonl

  train_role_targets: data/hotpotqa_distractor_v6_10k_llm/targets/train.jsonl
  val_role_targets: data/hotpotqa_distractor_v6_10k_llm/targets/val.jsonl
  test_role_targets: data/hotpotqa_distractor_v6_10k_llm/targets/test.jsonl

train:
  batch_size: 1
  num_workers: 0
  epochs: 3
  lr: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  max_length: 256
  grad_accum_steps: 16
  max_grad_norm: 1.0
  log_every: 20
  fp16: false
  role_aux_weight: 0.2
  margin_loss_weight: 0.2
  margin: 0.2
